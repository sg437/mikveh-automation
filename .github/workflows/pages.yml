# מפרסם את האפליקציה (תיקיית app/) כאתר GitHub Pages בכל דחיפה ל-main.
# ה-Workflow מפעיל את Pages בעצמו (enablement: true) – אין צורך לגעת בהגדרות הריפו.
# הכתובת שתתקבל: https://<שם המשתמש>.github.io/mikveh-automation/
name: פרסום האפליקציה

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        # מפעיל את Pages על הריפו אם עדיין לא הופעל, במקום השלב הידני שב-Settings
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
