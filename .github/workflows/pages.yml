# מפרסם את האפליקציה (תיקיית app/) כאתר GitHub Pages בכל דחיפה ל-main.
# הפעלה חד-פעמית לפני ההרצה הראשונה: Settings ⇠ Pages ⇠ Source: GitHub Actions.
# (enablement: true לא עוזר כאן – ל-GITHUB_TOKEN אין הרשאה ליצור את אתר ה-Pages,
#  הוא מחזיר "Create Pages site failed: Resource not accessible by integration".)
# הכתובת שתתקבל: https://<שם המשתמש>.github.io/mikveh-automation/
name: פרסום האפליקציה

on:
  push:
    branches: [main]
    paths: ['app/**', 'tools/make_talk.py', 'tools/build_config.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # כתובת הגיליון נכנסת ל-app/config.js בזמן הפרסום, כדי שכל מי שפותח
      # את הקישור יגיע למערכת המחוברת (ומשם למסך הכניסה) ולא ל"לא מחובר".
      # ההגדרה: Settings ⇠ Secrets and variables ⇠ Actions ⇠ Variables.
      - name: הזרקת כתובת הגיליון
        env:
          MIKVEH_API_URL: ${{ vars.MIKVEH_API_URL }}
          MIKVEH_API_TOKEN: ${{ vars.MIKVEH_API_TOKEN }}
          MIKVEH_GOOGLE_CLIENT_ID: ${{ vars.MIKVEH_GOOGLE_CLIENT_ID }}
        run: python3 tools/build_config.py
      # אפליקציית הדיונים (app/talk/) נבנית מחדש מ-app/index.html בכל פרסום,
      # כדי שלא תישאר מאחור אחרי שינוי במסכים.
      - name: בניית אפליקציית הדיונים
        run: python3 tools/make_talk.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
